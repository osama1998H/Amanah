on: [push]

jobs:
  static-analysis:
    runs-on: ubuntu-latest
    name: Static Analysis
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4.2.2

      - name: Set up Go
        uses: actions/setup-go@v5.4.0
        with:
          go-version: '1.23'

      - name: Install Dependencies
        run: go mod download

      - name: Run Static Code Analysis
        run: |
          go install github.com/golangci/golangci-lint/cmd/golangci-lint@latest
          golangci-lint run --timeout=5m

  test:
    runs-on: ubuntu-latest
    name: Run Tests
    needs: static-analysis
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4.2.2

      - name: Set up Go
        uses: actions/setup-go@v5.4.0
        with:
          go-version: '1.23'

      - name: Install Dependencies
        run: go mod download

      - name: Run Tests with Coverage
        run: |
          mkdir -p coverage
          go test -v -race -coverprofile=coverage/coverage.out -covermode=atomic ./...
          go tool cover -func=coverage/coverage.out | tee coverage/coverage.txt
          go tool cover -html=coverage/coverage.out -o coverage/coverage.html

      - name: Check Coverage Threshold
        run: |
          COVERAGE=$(tail -1 coverage/coverage.txt | awk '{print $3}' | sed 's/%//')
          echo "Total coverage: ${COVERAGE}%"
          if (( $(echo "$COVERAGE < 70" | bc -l) )); then
            echo "::warning::Coverage ${COVERAGE}% is below 70% threshold"
          fi

      - name: Upload Coverage Report
        uses: actions/upload-artifact@v4.6.2
        with:
          name: coverage-report
          path: coverage/

  build:
    runs-on: ubuntu-latest
    name: Build Application
    needs: test
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4.2.2

      - name: Set up Go
        uses: actions/setup-go@v5.4.0
        with:
          go-version: '1.23'

      - name: Install Dependencies
        run: go mod download

      - name: Build Services
        run: |
          mkdir -p build
          go build -o build/api-gateway ./services/api-gateway/cmd
          go build -o build/authentication ./services/authentication/cmd
          go build -o build/transaction ./services/transaction/cmd
          go build -o build/account ./services/account/cmd

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4.6.2
        with:
          name: build-artifacts
          path: build/

  docker:
    runs-on: ubuntu-latest
    name: Docker Build and Push
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4.2.2

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Docker Image
        run: docker build -t ${{ secrets.DOCKER_USERNAME }}/amanah:latest .

      - name: Push Docker Image
        run: docker push ${{ secrets.DOCKER_USERNAME }}/amanah:latest

  benchmark:
    runs-on: ubuntu-latest
    name: Run Benchmarks
    needs: test
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4.2.2

      - name: Set up Go
        uses: actions/setup-go@v5.4.0
        with:
          go-version: '1.23'

      - name: Install Dependencies
        run: go mod download

      - name: Run Benchmark Tests
        run: |
          mkdir -p benchmark_reports
          go test -bench=. -benchmem ./... > benchmark_reports/benchmark_results.txt 2>&1 || true

      - name: Upload Benchmark Results
        uses: actions/upload-artifact@v4.6.2
        with:
          name: benchmark-results
          path: benchmark_reports/benchmark_results.txt

  notify:
    runs-on: ubuntu-latest
    name: Notify Build Status
    needs: [static-analysis, test, build]
    if: failure()
    steps:
      - name: Notify Build Status
        run: echo "Build failed!"
