# Amanah Payment Gateway - Docker Compose Configuration
# Use for local development and testing

version: '3.9'

services:
  # ============================================
  # API Gateway
  # ============================================
  gateway:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    image: amanah/gateway:latest
    container_name: amanah-gateway
    ports:
      - "8080:8080"
      - "8443:8443"
      - "9090:9090"
    environment:
      - ENV=development
      - LOG_LEVEL=debug
      - LOG_FORMAT=json
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=amanah
      - DB_USER=amanah
      - DB_PASSWORD=amanah_secret
      - DB_SSL_MODE=disable
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=
      - JWT_SECRET=${JWT_SECRET:-development-jwt-secret-key-32chars}
      - API_KEY_SECRET=${API_KEY_SECRET:-development-api-key-secret}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - amanah-network
    restart: unless-stopped

  # ============================================
  # PostgreSQL Database
  # ============================================
  postgres:
    image: postgres:16-alpine
    container_name: amanah-postgres
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=amanah
      - POSTGRES_USER=amanah
      - POSTGRES_PASSWORD=amanah_secret
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U amanah -d amanah"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - amanah-network
    restart: unless-stopped

  # ============================================
  # Redis Cache
  # ============================================
  redis:
    image: redis:7-alpine
    container_name: amanah-redis
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - amanah-network
    restart: unless-stopped

  # ============================================
  # RabbitMQ Message Broker
  # ============================================
  rabbitmq:
    image: rabbitmq:3.12-management-alpine
    container_name: amanah-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      - RABBITMQ_DEFAULT_USER=amanah
      - RABBITMQ_DEFAULT_PASS=amanah_secret
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 5
    networks:
      - amanah-network
    restart: unless-stopped

  # ============================================
  # Prometheus Metrics
  # ============================================
  prometheus:
    image: prom/prometheus:v2.48.0
    container_name: amanah-prometheus
    ports:
      - "9091:9090"
    volumes:
      - ./configs/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
      - '--web.enable-lifecycle'
    networks:
      - amanah-network
    restart: unless-stopped

  # ============================================
  # Grafana Dashboards
  # ============================================
  grafana:
    image: grafana/grafana:10.2.2
    container_name: amanah-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana-data:/var/lib/grafana
      - ./configs/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus
    networks:
      - amanah-network
    restart: unless-stopped

  # ============================================
  # Jaeger Tracing (Development)
  # ============================================
  jaeger:
    image: jaegertracing/all-in-one:1.52
    container_name: amanah-jaeger
    ports:
      - "16686:16686"
      - "14268:14268"
      - "6831:6831/udp"
    environment:
      - COLLECTOR_OTLP_ENABLED=true
    networks:
      - amanah-network
    restart: unless-stopped

# ============================================
# Networks
# ============================================
networks:
  amanah-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16

# ============================================
# Volumes
# ============================================
volumes:
  postgres-data:
  redis-data:
  rabbitmq-data:
  prometheus-data:
  grafana-data:
