# Amanah Payment Gateway - Kubernetes Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: amanah-gateway
  namespace: amanah
  labels:
    app: amanah
    component: gateway
    version: v1
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: amanah
      component: gateway
  template:
    metadata:
      labels:
        app: amanah
        component: gateway
        version: v1
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9090"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: amanah-gateway
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      
      # Anti-affinity: spread pods across nodes
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app: amanah
                    component: gateway
                topologyKey: kubernetes.io/hostname

      containers:
        - name: gateway
          image: amanah/gateway:latest
          imagePullPolicy: Always
          
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
            - name: https
              containerPort: 8443
              protocol: TCP
            - name: metrics
              containerPort: 9090
              protocol: TCP
          
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: ENV
              value: "production"
            - name: LOG_LEVEL
              value: "info"
            - name: LOG_FORMAT
              value: "json"
            - name: DB_HOST
              valueFrom:
                secretKeyRef:
                  name: amanah-db-credentials
                  key: host
            - name: DB_PORT
              valueFrom:
                secretKeyRef:
                  name: amanah-db-credentials
                  key: port
            - name: DB_NAME
              valueFrom:
                secretKeyRef:
                  name: amanah-db-credentials
                  key: database
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: amanah-db-credentials
                  key: username
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: amanah-db-credentials
                  key: password
            - name: DB_SSL_MODE
              value: "require"
            - name: REDIS_HOST
              valueFrom:
                secretKeyRef:
                  name: amanah-redis-credentials
                  key: host
            - name: REDIS_PORT
              valueFrom:
                secretKeyRef:
                  name: amanah-redis-credentials
                  key: port
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: amanah-redis-credentials
                  key: password
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: amanah-jwt-secrets
                  key: secret
            - name: API_KEY_SECRET
              valueFrom:
                secretKeyRef:
                  name: amanah-api-secrets
                  key: secret
          
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          
          startupProbe:
            httpGet:
              path: /health/live
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 30
          
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: config
              mountPath: /app/configs
              readOnly: true
      
      volumes:
        - name: tmp
          emptyDir: {}
        - name: config
          configMap:
            name: amanah-gateway-config

      terminationGracePeriodSeconds: 30

---
# Service
apiVersion: v1
kind: Service
metadata:
  name: amanah-gateway
  namespace: amanah
  labels:
    app: amanah
    component: gateway
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
    - name: https
      port: 443
      targetPort: https
      protocol: TCP
    - name: metrics
      port: 9090
      targetPort: metrics
      protocol: TCP
  selector:
    app: amanah
    component: gateway

---
# Horizontal Pod Autoscaler
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: amanah-gateway-hpa
  namespace: amanah
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: amanah-gateway
  minReplicas: 3
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Pods
          value: 1
          periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
        - type: Pods
          value: 2
          periodSeconds: 30

---
# Pod Disruption Budget
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: amanah-gateway-pdb
  namespace: amanah
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app: amanah
      component: gateway

---
# ServiceAccount
apiVersion: v1
kind: ServiceAccount
metadata:
  name: amanah-gateway
  namespace: amanah
  labels:
    app: amanah
    component: gateway

---
# ConfigMap
apiVersion: v1
kind: ConfigMap
metadata:
  name: amanah-gateway-config
  namespace: amanah
data:
  gateway.yaml: |
    server:
      host: "0.0.0.0"
      port: 8080
      tls_port: 8443
      metrics_port: 9090
      
    timeouts:
      read: "5s"
      write: "10s"
      idle: "120s"
      shutdown: "30s"
      
    rate_limit:
      enabled: true
      requests_per_second: 1000
      burst: 2000
      
    circuit_breaker:
      enabled: true
      threshold: 5
      timeout: "30s"
      half_open_requests: 3
      
    cors:
      enabled: true
      allowed_origins:
        - "*"
      allowed_methods:
        - "GET"
        - "POST"
        - "PUT"
        - "DELETE"
        - "OPTIONS"
      allowed_headers:
        - "Authorization"
        - "Content-Type"
        - "X-Request-ID"
        - "X-API-Key"
      max_age: 86400
